    card("why", de ? "Warum ändert sich der Preis?" : "Why does the price change?", de
      ? `<p>Jeden Tag um <b>12 Uhr</b> wird an der Strombörse (EPEX Spot) der Strom für den nächsten Tag versteigert, und zwar für <b>jede Viertelstunde einzeln</b>. Gegen 13 Uhr stehen die Preise fest.</p>
         <p>Zuerst kommen die günstigsten Kraftwerke zum Einsatz: Sonne und Wind (fast kostenlos), danach Kohle und zuletzt Gas. Den Preis für alle bestimmt das <b>teuerste Kraftwerk, das noch gebraucht wird</b> (Merit-Order). Viel Sonne und Wind bedeutet also günstigen Strom.</p>`
      : `<p>Every day at <b>noon</b>, the EPEX Spot exchange auctions the next day's electricity in <b>15-minute blocks</b>. Around 1 pm the prices are final.</p>
         <p>Power plants are called in by cost: sun and wind first (almost free), then coal, gas last. The <b>most expensive plant still needed</b> sets the price for everyone (merit order). Plenty of sun and wind means cheap power.</p>`),
    card("neg", de ? "Negative Preise" : "Negative prices", de
      ? `<p>Wird mehr Strom erzeugt als gebraucht, bezahlen die Erzeuger sogar dafür, dass jemand ihn abnimmt. Der Börsenpreis liegt dann <b>unter null</b>.</p>
         ${st ? `<p>In den letzten ${st.n} Tagen: <b>${st.negHours} Stunden</b> an ${st.negDays} Tagen.</p>` : ""}
         <p>Netzentgelt, Steuern und Umlagen zahlen Sie trotzdem. Ihr Preis bleibt deshalb meist über null, ist dann aber sehr niedrig.</p>`
      : `<p>When more power is produced than needed, producers pay to get rid of it: the market price falls <b>below zero</b>.</p>
         ${st ? `<p>In the last ${st.n} days: <b>${st.negHours} hours</b> on ${st.negDays} days.</p>` : ""}
         <p>You still pay grid fees, taxes and levies, so your final price usually stays positive, just very low.</p>`),
    card("book", de ? "Wichtige Begriffe" : "Glossary", de
      ? `<dl class="gloss"><dt>Day-Ahead-Preis</dt><dd>Der Börsenpreis für den nächsten Tag. Er wird am Tag davor festgelegt.</dd>
         <dt>Endpreis („Ihr Preis“)</dt><dd>Börsenpreis plus Netzentgelt, Steuern, Umlagen und Mehrwertsteuer. Das, was Sie wirklich bezahlen.</dd>
         <dt>Dynamischer Tarif</dt><dd>Ihr Preis ändert sich mit dem Börsenpreis, jede Viertelstunde.</dd>
         <dt>Smart Meter</dt><dd>Ein digitaler Stromzähler, der Ihren Verbrauch pro Viertelstunde misst. Ohne ihn gibt es keinen dynamischen Tarif.</dd>
         <dt>§ 14a EnWG</dt><dd>Wenn Sie Wallbox oder Wärmepumpe beim Netzbetreiber als steuerbar anmelden, zahlen Sie weniger Netzentgelt.</dd></dl>`
      : `<dl class="gloss"><dt>Day-ahead price</dt><dd>Market price for tomorrow, auctioned the day before.</dd>
         <dt>Final price</dt><dd>Market price plus grid fees, taxes, levies and VAT. What you actually pay.</dd>
         <dt>Dynamic tariff</dt><dd>Your price follows the market, quarter-hour by quarter-hour.</dd>
         <dt>Smart meter</dt><dd>Measures your use per quarter-hour. Required for a dynamic tariff.</dd>
         <dt>§ 14a EnWG</dt><dd>Register a wallbox or heat pump as controllable and pay reduced grid fees.</dd></dl>`),
  ];

  // cost per use at the typically cheapest vs. priciest hour, at the user's final price
  const cLo = st ? endPrice(st.perHour[st.lo]) : null, cHi = st ? endPrice(st.perHour[st.hi]) : null;
  const useRows = USES.map(([k, kwh]) => `<tr><td>${USE_NAMES[lang][k]}<small>${num(kwh, kwh < 10 ? 1 : 0)} kWh</small></td>
    ${st ? `<td class="good">${eur(kwh * cLo / 100)}</td><td class="bad">${eur(kwh * cHi / 100)}</td>` : ""}</tr>`).join("");
  const rTxt = st?.r == null ? "" : st.r < -0.4
    ? (de ? `<p>Heute gilt: <b>Je mehr Ökostrom im Netz ist, desto günstiger ist der Strom.</b> Wer zur günstigen Zeit Strom nutzt, nutzt also meist auch Ökostrom.</p>`
          : `<p>Today: <b>the more green power in the grid, the cheaper it is.</b> Using power at cheap times usually means using green power.</p>`)
    : (de ? `<p>Heute sind die günstigsten Zeiten nicht unbedingt die grünsten. Der Planer zeigt Ihnen deshalb auch die grünste Zeit.</p>`
          : `<p>Today the cheapest times are not necessarily the greenest. The planner therefore also shows you the greenest time.</p>`);

  const right = [
    `<div class="rail-title">${de ? "Tipps & Fakten" : "Tips & facts"}</div>`,
    st ? card("facts", de ? `Die letzten ${st.n} Tage` : `The last ${st.n} days`,
      `<div class="facts">
        <div><div class="v">${ct(st.spread / 10, 0)}</div><div class="k">${de ? "Abstand zwischen billigster und teuerster Viertelstunde eines Tages (Ø)" : "average gap between the cheapest and priciest quarter-hour of a day"}</div></div>
        <div><div class="v">${st.weekendPct != null ? `${st.weekendPct} %` : "–"}</div><div class="k">${de ? "günstiger am Wochenende als unter der Woche" : "cheaper at weekends than on weekdays"}</div></div>
        <div><div class="v">${hr(st.lo).replace(" Uhr", "")}</div><div class="k">${de ? "im Schnitt die günstigste Stunde" : "cheapest hour on average"}</div></div>
        <div><div class="v">${st.negHours}</div><div class="k">${de ? "Stunden mit negativem Börsenpreis" : "hours with a negative market price"}</div></div>
      </div>${rTxt ? `<div style="margin-top:10px">${rTxt}</div>` : ""}`) : "",
    card("plug", de ? "Wie viel Strom braucht was?" : "What uses how much?",
      `<table class="use-table"><thead><tr><th>${de ? "Gerät" : "Appliance"}</th>${st ? `<th><span class="pill cheap">${st.lo} ${de ? "Uhr" : "h"}</span></th><th><span class="pill pricey">${st.hi} ${de ? "Uhr" : "h"}</span></th>` : ""}</tr></thead><tbody>${useRows}</tbody></table>
       <p style="margin-top:10px">${de ? "Ungefähre Werte pro Nutzung, gerechnet mit Ihrem Preis zur günstigsten und zur teuersten Stunde. Bei der Waschmaschine geht es um Cent, beim E-Auto und bei der Wärmepumpe um Euro: <b>Am meisten sparen Sie bei großen Verbrauchern.</b>"
                                      : "Typical values per use; costs at the average final price of the cheapest and priciest hour. For a washer it's cents, for an EV or heat pump it's euros: <b>big consumers pay off most.</b>"}</p>`),
    card("tip", de ? "Spartipps" : "Saving tips", de
      ? `<ul><li>Nutzen Sie die <b>Startzeitvorwahl</b>: Fast jede Wasch- und Spülmaschine kann später starten.</li>
         <li><b>Eco-Programme</b> dauern länger, brauchen aber viel weniger Strom. Und die Maschine immer voll beladen.</li>
         <li>Im <b>Homeoffice</b> lieber mittags kochen, backen oder das Wasser im Boiler aufheizen.</li>
         <li>Mit <b>Balkonkraftwerk</b> oder Solaranlage: Mittags haben Sie eigenen Strom, und der Strom aus dem Netz ist dann auch am günstigsten.</li>
         <li>Große Wäsche am besten am <b>Samstag- oder Sonntagmittag</b>.</li>
         <li>Kühlschrank und Router einfach laufen lassen. Verschieben lohnt sich nur bei Geräten, die Sie selbst einschalten.</li></ul>`
      : `<ul><li>Use the <b>delay-start timer</b>: almost every washer and dishwasher has one.</li>
         <li><b>Eco programmes</b> run longer but use much less power. Full loads pay off twice.</li>
         <li><b>Working from home?</b> Cook, bake or heat the hot-water tank at midday.</li>
         <li>With a <b>balcony solar panel</b> or rooftop PV: at midday your own power is there and market power is cheapest.</li>
         <li>Use the <b>weekend</b>: big laundry on Saturday or Sunday around noon.</li>
         <li>Leave the fridge and router alone. Shifting only pays for appliances you start yourself.</li></ul>`),
    card("tariff", de ? "Lohnt sich ein dynamischer Tarif?" : "Is a dynamic tariff worth it?", de
      ? `<p>Seit 2025 muss <b>jeder Stromanbieter</b> einen dynamischen Tarif anbieten. Dafür brauchen Sie ein <b>Smart Meter</b>. Der Messstellenbetreiber muss es auf Wunsch einbauen, die Kosten dafür sind gesetzlich begrenzt.</p>
         <p><b>Eher ja:</b> mit E-Auto, Wärmepumpe oder Heimspeicher, und wenn Sie Ihren Verbrauch verschieben können. <b>Eher nein:</b> wenn Sie wenig Strom brauchen und nichts verschieben können. Dann tragen Sie das Risiko teurer Winterabende, ohne viel zu sparen.</p>
         <p>Im Planer sehen Sie bei <b>„Gegenüber Festpreis“</b>, ob Sie heute mit einem dynamischen Tarif sparen würden.</p>`
      : `<p>Since 2025, <b>every supplier</b> in Germany has to offer a dynamic tariff. You need a <b>smart meter</b>; the metering operator must install one on request and its cost is capped by law.</p>
         <p><b>Likely yes</b> with an EV, heat pump or home battery and some flexibility. <b>Likely no</b> with low, fixed consumption: you'd carry the risk of pricey winter evenings for little gain.</p>
         <p>In the planner, <b>"vs. fixed tariff"</b> shows whether a dynamic tariff would save you money today.</p>`),
    card("safe", de ? "Sicherheit & Nachbarn" : "Safety & neighbours", de
      ? `<ul><li>Die Feuerwehr rät: <b>Trockner und Waschmaschine nur laufen lassen, wenn jemand da ist</b>, also nicht, wenn Sie weg sind oder schlafen. Wählen Sie lieber eine günstige Zeit, in der Sie wach und zu Hause sind.</li>
         <li>Das Flusensieb im Trockner nach jedem Trocknen sauber machen.</li>
         <li>In Mietshäusern gilt meist <b>Nachtruhe von 22 bis 6 Uhr</b>. Schleudern um Mitternacht hört das ganze Haus.</li>
         <li>Ein E-Auto regelmäßig nur an einer Wallbox oder einer geeigneten Steckdose laden, nie über eine Mehrfachsteckdose oder Kabeltrommel.</li></ul>`
      : `<ul><li>Fire brigades advise <b>not running dryers and washers unattended</b> or overnight. Pick a cheap window when you're home and awake.</li>
         <li>Clean the dryer's lint filter after every run.</li>
         <li>In apartment buildings, <b>quiet hours are usually 10 pm–6 am</b>: a midnight spin cycle wakes the whole house.</li>
         <li>Charge an EV regularly only from a wallbox or a suitable socket, never through a power strip or cable reel.</li></ul>`),
  ];
  // balance the two rails: the dynamic-tariff card joins the explanations, negative prices join the facts
  const [L0, L1, L2, L3, L4, L5] = left, [R0, R1, R2, R3, R4, R5] = right;
  return { left: [L0, L1, L2, L3, R4, L5].join(""), right: [R0, R1, L4, R2, R3, R5].join("") };
}

function renderRails() {
  const st = railStats();
  const { left, right } = railContent(st);
  $("rail-left").innerHTML = left;
  $("rail-right").innerHTML = right;
  const mini = $("mini");
  if (!mini) return;
  const tip = $("mini-tip");
  mini.onmousemove = (ev) => {
    const bar = ev.target.closest("rect");
    if (!bar) { tip.style.display = "none"; return; }
    tip.textContent = bar.dataset.tip; tip.style.display = "block";
    const box = mini.getBoundingClientRect();
    let x = ev.clientX - box.left + 12;
    if (x + tip.offsetWidth > box.width) x -= tip.offsetWidth + 24;
    tip.style.left = `${x}px`; tip.style.top = `${ev.clientY - box.top - 36}px`;
  };
  mini.onmouseleave = () => { tip.style.display = "none"; };
}

/* ================= theme & language ================= */
const ICONS = {
  moon: '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
};
const isLight = () => document.documentElement.dataset.theme === "light";
const syncIcon = () => { $("theme-icon").innerHTML = isLight() ? ICONS.moon : ICONS.sun; };
$("theme-btn").onclick = () => {
  document.documentElement.dataset.theme = isLight() ? "dark" : "light";
  try { localStorage.setItem("theme", document.documentElement.dataset.theme); } catch {}
  syncIcon(); render();
};
const setLang = (l) => { lang = l; try { localStorage.setItem("lang", l); } catch {} render(); };
$("lang-de").onclick = () => setLang("de");
$("lang-en").onclick = () => setLang("en");
syncIcon();

render();
load();
// keep "now" current; fetch new data every 15 minutes (tomorrow's prices arrive in the afternoon)
setInterval(() => { if (S.data) { renderKpis(); drawCharts(); renderHero(); } }, 60000);
setInterval(load, 15 * 60000);
</script>
