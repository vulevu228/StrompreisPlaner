name: Fetch prices

# Tomorrow's prices are published around 12:45 German time. GitHub often delays
# scheduled runs by hours, so several runs spread over the day make sure
# tomorrow's prices land the same afternoon; runs with no new data commit nothing.
on:
  schedule:
    - cron: "10 11,12,13,14,16,19,22 * * *"
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-prices
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/fetch_prices.py
      - name: Commit new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices_15min.csv docs/data/latest.json docs/data/europe.json
          if git diff --cached --quiet; then echo "No new data"; exit 0; fi
          git commit -m "Update prices $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
